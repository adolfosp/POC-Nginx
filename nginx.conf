worker_processes 1;

events { worker_connections 1024; }

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log notice;

    # rate limit: 1 request/segundo por IP
    # limit_req_zone $binary_remote_addr zone=limite_por_ip:10m rate=1r/s;
    # limit_req_status 429;

    upstream backend_api {
        server api:3000; # serviço "api" do docker-compose
    }

    server {
        listen 80;

        location / {
            # bloqueio por header
            if ($http_x_blocked = "yes") {
                return 444;
            }

            # aplica rate limit
            # limit_req zone=limite_por_ip burst=2 nodelay;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
